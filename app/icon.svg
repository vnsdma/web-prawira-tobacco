<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      color: #a85a22;
    }
    @media (prefers-color-scheme: dark) {
      :root, g {
        color: #f09a56 !important;
      }
    }
  </style>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="color: #a85a22;">
    <!-- === OUTER LEAF CONTOUR === -->
    <path d="M 50 13 C 74 31, 74 58, 50 78 C 26 58, 26 31, 50 13 Z" stroke-width="3.6"/>
    
    <!-- Curved Stem -->
    <path d="M 50 78 C 50 82, 47 86, 44 87" stroke-width="3.2"/>

    <!-- === UPPER LEAF VEINS === -->
    <!-- Center top vein -->
    <line x1="50" y1="17" x2="50" y2="34" stroke-width="2.6"/>
    <!-- Angled branch veins -->
    <path d="M 50 24 L 38 29" stroke-width="2.4"/>
    <path d="M 50 24 L 62 29" stroke-width="2.4"/>
    <path d="M 50 31 L 42 34" stroke-width="2.2" opacity="0.8"/>
    <path d="M 50 31 L 58 34" stroke-width="2.2" opacity="0.8"/>

    <!-- === PLAYFUL SMILING FACE === -->
    <!-- Left Smiling Eye -->
    <path d="M 39 44 C 41 40, 46 40, 48 44" stroke-width="3.2"/>
    
    <!-- Right Smiling Eye -->
    <path d="M 52 44 C 54 40, 59 40, 61 44" stroke-width="3.2"/>
    
    <!-- Friendly Smile -->
    <path d="M 40 54 C 44 61, 56 61, 60 54" stroke-width="3.4"/>

    <!-- === LOWER VEIN ACCENTS (Cradling the face) === -->
    <path d="M 50 73 C 42 69, 36 64, 34 57" stroke-width="2.4"/>
    <path d="M 50 73 C 58 69, 64 64, 66 57" stroke-width="2.4"/>
  </g>
</svg>
